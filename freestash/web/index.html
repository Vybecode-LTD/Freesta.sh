<!doctype html>
<html lang="en" data-theme="dark" data-accent="sodium">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06090E" />
    <meta name="description" content="Search 20 museums, archives and libraries for public-domain and openly licensed images, audio, video, textures, 3D, fonts and icons, each cleared for what you'll do with it." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Freesta.sh: open media, cleared for your use</title>
    <script>
      // Paint the saved theme before React loads, so there's no flash of the wrong one.
      try {
        var p = JSON.parse(localStorage.getItem("freestash.prefs") || "null");
        var t = p && p.theme ? p.theme : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = t;
        if (p && p.accent) document.documentElement.dataset.accent = p.accent;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
